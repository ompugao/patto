name: Android app

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'patto-flutter/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'patto-flutter/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  # The Release workflow creates the GitHub release with GITHUB_TOKEN, and
  # GitHub does not fire `release` events for that; so run after it finishes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APKs to (for example v0.6.0)
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # Must match android/app/build.gradle.kts; the Rust library is cross-compiled
  # against this NDK.
  NDK_VERSION: 27.2.12479018
  FLUTTER_VERSION: 3.47.4
  # Must match pubspec.yaml and patto-flutter/rust/Cargo.toml.
  FRB_VERSION: 2.13.0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # Release runs on pull requests too; only a successful tag push is a release.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Needed to attach the APKs to the release; pull requests get a read-only
    # token regardless.
    permissions:
      contents: write

    steps:
      # A workflow_run checks out the default branch by default; build the tag
      # (or the requested one) instead.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && format('refs/tags/{0}', github.event.workflow_run.head_branch) || inputs.tag || github.ref }}

      # A release build takes its version from the tag rather than pubspec.yaml,
      # so each release installs over the previous one. The build number is
      # major * 1000000 + minor * 1000 + patch; Flutter then adds 1000 * ABI
      # (2 for arm64-v8a, 4 for x86_64) to each split APK, so the code of a
      # given ABI still grows with the version.
      - name: Resolve the release version
        id: version
        env:
          # For a tag push, head_branch is the tag name.
          TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Not a release build; using the version from pubspec.yaml"
            exit 0
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a semantic version"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          build_number=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "build_args=--build-name=$version --build-number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version (build number $build_number) for $TAG"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('patto-flutter/rust/Cargo.lock') }}

      # The build directory is deliberately not cached: two Android ABIs of
      # vendored OpenSSL and libgit2 would be several gigabytes and crowd out
      # the other jobs' caches. Expect this job to take around fifteen minutes.

      # Cargokit resolves the NDK through the SDK command-line tools; install the
      # pinned version up front so the build does not depend on the image's.
      - name: Install Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` exits non-zero once sdkmanager stops reading, which is not a
          # failure; the licences are already accepted on the runner image.
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "ndk;${NDK_VERSION}"

      - name: Fetch packages
        working-directory: patto-flutter
        run: flutter pub get

      - name: Analyze
        working-directory: patto-flutter
        run: flutter analyze

      - name: Run Dart tests
        working-directory: patto-flutter
        run: flutter test

      # Only a release build sees the upload key; everything else, including
      # pull requests of this repository, is signed with the runner's debug key.
      # Secrets are not available to `if:`, so the shell decides whether all
      # four are set.
      - name: Write the signing key
        if: steps.version.outputs.tag != ''
        working-directory: patto-flutter/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set_count=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] && set_count=$((set_count + 1))
          done
          if [ "$set_count" -eq 0 ]; then
            echo "::warning::No ANDROID_KEYSTORE_* secrets: the release APKs are signed with the debug key and will not update an earlier install. See patto-flutter/README.md, Releases."
            echo "Signing with the debug key"
            exit 0
          fi
          if [ "$set_count" -ne 4 ]; then
            echo "::error::set all of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or none"
            exit 1
          fi
          keystore="$PWD/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "Signing with the upload key '$KEY_ALIAS'"

      - name: Build release APKs
        working-directory: patto-flutter
        # Name the platforms explicitly: Flutter otherwise also emits an
        # armeabi-v7a slice, for which no Rust library is built.
        env:
          BUILD_ARGS: ${{ steps.version.outputs.build_args }}
        run: |
          # shellcheck disable=SC2086 # two simple --flag=value words
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 $BUILD_ARGS

      - name: Remove the signing key
        if: always()
        run: rm -f patto-flutter/android/key.properties patto-flutter/android/upload-keystore.jks

      - name: Check the Rust library made it into the APK
        working-directory: patto-flutter
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/librust_lib_patto_flutter.so'; then
            echo "::error::the Rust library is missing from $apk"
            exit 1
          fi
          unzip -l "$apk" | grep '\.so$'

      - name: Show the signing certificate
        working-directory: patto-flutter/build/app/outputs/flutter-apk
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in *-release.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep 'certificate DN'
          done

      - name: Name the APKs
        id: apks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            src="patto-flutter/build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -n "$VERSION" ]; then
              cp "$src" "dist/patto-notes-$VERSION-$abi.apk"
            else
              cp "$src" "dist/patto-notes-$abi.apk"
            fi
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: patto-notes-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach the APKs to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber

  codegen:
    name: Generated bindings are current
    runs-on: ubuntu-latest
    # Release runs on pull requests too; only a successful tag push is a release.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      # A workflow_run checks out the default branch by default; build the tag
      # (or the requested one) instead.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && format('refs/tags/{0}', github.event.workflow_run.head_branch) || inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-frb-${{ env.FRB_VERSION }}-${{ hashFiles('patto-flutter/rust/Cargo.lock') }}

      # The cache restores ~/.cargo/bin, and `cargo install` refuses to overwrite
      # a binary that is already there. Its key carries the version, so anything
      # restored is the version this job wants.
      - name: Install the bridge codegen
        run: |
          if ! command -v flutter_rust_bridge_codegen > /dev/null; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked \
              || cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION"
          fi
          if ! command -v cargo-expand > /dev/null; then
            cargo install cargo-expand --locked
          fi

      - name: Fetch packages
        working-directory: patto-flutter
        run: flutter pub get

      # The generated Dart and Rust are committed so a plain `flutter run` works
      # without the codegen installed; this catches an API change that was not
      # regenerated.
      - name: Regenerate
        working-directory: patto-flutter
        run: flutter_rust_bridge_codegen generate

      - name: Fail if the checked-in bindings differ
        run: |
          if ! git diff --exit-code -- patto-flutter/lib/src/rust patto-flutter/rust/src/frb_generated.rs; then
            echo "::error::run 'flutter_rust_bridge_codegen generate' and commit the result"
            exit 1
          fi
